[project]
name = "mcp-icloud"
version = "0.1.0"
description = "Local MCP server (stdio) for iCloud Hide My Email and iCloud Mail, built on pyicloud."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "mcp==2.3.0",
    "pyicloud==2026.11.2",
]

[project.scripts]
mcp-icloud = "mcp_icloud.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_icloud"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
